name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          PY

      - name: Compile Python sources when present
        run: |
          if [ -d custom_components ]; then
            python -m compileall -q custom_components
          fi
          python -m compileall -q tests

      - name: Verify deterministic autonomous frontend bundle
        run: |
          node scripts/build-frontend-bundle.mjs --check
          node --check custom_components/vless_gateway/frontend/vless-gateway-panel.js
          node tests/shell_v2_harness.mjs

      - name: Verify integration and specialized-panel contracts
        run: python -m unittest discover -s tests -v

      - name: Enforce NikaS UI standard v2.2
        run: python scripts/check_nikas_ui_standard.py

      - name: Validate approved repository icon
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path

          path = Path('assets/icon.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('assets/icon.png is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (512, 512):
              raise SystemExit(f'Unexpected repository icon size: {(width, height)}')
          if data[25] not in (4, 6):
              raise SystemExit('Repository icon has no alpha channel')
          packaged_1x = Path('custom_components/vless_gateway/brand/icon.png').read_bytes()
          width_1x, height_1x = struct.unpack('>II', packaged_1x[16:24])
          if (width_1x, height_1x) != (256, 256):
              raise SystemExit(f'Unexpected packaged 1x icon size: {(width_1x, height_1x)}')
          packaged_2x = Path('custom_components/vless_gateway/brand/icon@2x.png').read_bytes()
          if packaged_2x != data:
              raise SystemExit('Packaged 2x integration icon differs from approved repository icon')
          print('Repository icon OK: 512x512 source, 256x256 package and 512x512 @2x')
          PY

      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
      - name: Verify pinned standard documents
        run: |
          python scripts/check_standard_documents.py
          python tests/test_standard_document_sync.py

  hacs-validation:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate integration repository with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration with Hassfest
        uses: home-assistant/actions/hassfest@master

  validate:
    if: ${{ always() }}
    needs: [repository-checks, hacs-validation, hassfest]
    runs-on: ubuntu-latest
    steps:
      - name: Require repository checks, HACS, and Hassfest to pass
        shell: bash
        env:
          VLESS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json
          import os
          import sys

          required = {"repository-checks", "hacs-validation", "hassfest"}
          results = json.loads(os.environ["VLESS_JOB_RESULTS"])
          if not isinstance(results, dict) or set(results) != required:
              sys.exit("Required CI job results are missing or unexpected")
          failed = {
              name: results[name].get("result")
              for name in sorted(required)
              if not isinstance(results[name], dict)
              or results[name].get("result") != "success"
          }
          if failed:
              sys.exit(f"Required CI jobs did not succeed: {failed}")
          print(
              "Repository checks, HACS, and Hassfest succeeded; "
              "runtime acceptance remains separate."
          )
          PYGATE
